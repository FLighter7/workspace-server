name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  # scripts/build.mjs builds the web page, then every platform's binary
  # (wss-<os>-<arch>) and SHA256SUMS, into dist/.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client-wss/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: client-wss/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: node scripts/build.mjs "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          # A tag such as v1.0.0-rc.1 is a pre-release, not the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}
