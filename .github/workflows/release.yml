name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  # The web page, built once and embedded in every binary.
  page:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-wss
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client-wss/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: client-wss/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: page
          path: internal/web/ui/dist
          if-no-files-found: error

  build:
    needs: page
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: page
          path: internal/web/ui/dist
      # Without the page the binary still builds, and serves a 503 instead of it.
      - name: the page is there
        run: test -f internal/web/ui/dist/index.html
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: >
          go build -trimpath
          -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}"
          -o "workspace-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          ./cmd/workspace-server
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: workspace-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: |
          sha256sum workspace-server-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          # A tag such as v1.0.0-rc1 is a pre-release, not the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}
