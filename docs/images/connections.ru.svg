<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1646" width="1000" height="1646" role="img" aria-labelledby="title desc" xml:lang="ru">
  <title id="title">Локальный хаб: как связаны серверы и устройства</title>
  <desc id="desc">Три сцены. Дома: телефон и браузер ноутбука синхронизируются с главным сервером на ПК; подчинённый сервер на ноутбуке связан с главным, получает и отправляет документы и хранит те же файлы (apps/&lt;id&gt;/data.json и apps/&lt;id&gt;/history/) на своём диске; welcome главного сообщает каждому устройству роль и список подчинённых, а term семьи — когда он больше 0. В дороге: главный недоступен; телефон и браузер ноутбука синхронизируются с сервером ноутбука без повторного подключения; дома связь возвращается и ноутбук отправляет изменения, а если менялись обе стороны, на ноутбуке побеждает копия главного, а своя остаётся в history/. Смена главного: плановая ждёт, пока документы на обоих серверах совпадут, увеличивает term с 0 до 1, старый главный уступает роль и связывается с новым; при вынужденной главных два, с term 0 и 1, пока они не встретятся, и тогда побеждает больший term, а при равенстве больший serverId. Легенда: соединения устройств, связь серверов и подключение, которое бывает только к главному.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; }
    .h1 { font-size: 24px; font-weight: 700; }
    .h2 { font-size: 18px; font-weight: 700; }
    .h3 { font-size: 15px; font-weight: 700; }
    .name { font-size: 15px; font-weight: 650; }
    .lead { font-size: 14px; }
    .strong { font-weight: 650; }
    .muted { fill: #59636e; }
    .t-session { fill: #0969da; }
    .t-link { fill: #bc4c00; }
    .t-pairing { fill: #1a7f37; }
    .bg { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .node { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
    .main { fill: #f5f0ff; stroke: #8250df; stroke-width: 2.5; }
    .off { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .group { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 2 4; }
    .disk { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .disk-off { fill: none; stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 6 4; }
    .callout { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .divider { stroke: #d0d7de; stroke-width: 1; }
    .icon { fill: none; stroke: #59636e; stroke-width: 1.3; }
    .session { fill: none; stroke: #0969da; stroke-width: 2; }
    .link { fill: none; stroke: #bc4c00; stroke-width: 3.5; }
    .later { stroke-dasharray: 9 6; }
    .pairing { fill: none; stroke: #1a7f37; stroke-width: 2; stroke-dasharray: 7 5; }
    .gone { fill: none; stroke: #8c959f; stroke-width: 2; stroke-dasharray: 3 5; }
    .cross { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
    .cross-mark { fill: none; stroke: #59636e; stroke-width: 2; }
    .head-session { fill: #0969da; }
    .head-link { fill: #bc4c00; }
  </style>
  <defs>
    <marker id="head-session" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path class="head-session" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="head-link" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path class="head-link" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="1646" rx="16" class="bg"/>
  <text x="32" y="46" class="h1">Локальный хаб: серверы и устройства</text>
  <text x="32" y="72" class="lead muted">На ПК работает главный сервер, на ноутбуке — подчинённый. Устройства подключаются только к главному.</text>
  <!-- Legend -->
  <g>
    <rect x="16" y="88" width="968" height="76" rx="10" class="panel"/>
    <line x1="36" y1="113.5" x2="80" y2="113.5" class="session" marker-end="url(#head-session)"/>
    <text x="92" y="118">соединение устройства</text>
    <line x1="356" y1="113.5" x2="400" y2="113.5" class="link" marker-end="url(#head-link)"/>
    <text x="412" y="118">связь: подчинённый → главный</text>
    <line x1="676" y1="113.5" x2="720" y2="113.5" class="pairing"/>
    <text x="732" y="118">подключение: только к главному</text>
    <rect x="36" y="133" width="44" height="18" rx="5" class="main"/>
    <text x="92" y="148">главный сервер</text>
    <rect x="356" y="133" width="44" height="18" rx="5" class="node"/>
    <text x="412" y="148">подчинённый сервер</text>
    <line x1="676" y1="143.5" x2="720" y2="143.5" class="gone"/>
    <circle cx="698" cy="143.5" r="9" class="cross"/>
    <path d="M694,139.5 L702,147.5 M702,139.5 L694,147.5" class="cross-mark"/>
    <text x="732" y="148">нет связи</text>
  </g>
  <!-- Scene 1: at home -->
  <g>
    <rect x="16" y="180" width="968" height="476" rx="12" class="panel"/>
    <text x="36" y="212" class="h2">1 · Дома</text>
    <text x="36" y="236" class="lead muted">Устройства синхронизируются с главным и предпочитают его. Сервер ноутбука держит копию через связь.</text>
    <g>
      <rect x="36" y="260" width="224" height="220" rx="8" class="main"/>
      <text x="52" y="284" class="name">Главный сервер</text>
      <text x="52" y="304" class="muted">на ПК</text>
      <text x="52" y="344">подключает устройства</text>
      <text x="52" y="364">сообщает о подчинённых</text>
    </g>
    <g>
      <rect x="36" y="496" width="224" height="66" rx="8" class="disk"/>
      <path d="M50,508 a7,3 0 1,0 14,0 a7,3 0 1,0 -14,0 v10 a7,3 0 0,0 14,0 v-10" class="icon"/>
      <text x="72" y="518" class="strong">Диск ПК</text>
      <text x="50" y="538" class="mono">apps/&lt;id&gt;/data.json</text>
      <text x="50" y="554" class="mono">apps/&lt;id&gt;/history/</text>
    </g>
    <g>
      <rect x="408" y="340" width="160" height="56" rx="8" class="node"/>
      <text x="424" y="364" class="name">Телефон</text>
      <text x="424" y="384" class="muted">приложение todo</text>
    </g>
    <rect x="712" y="246" width="252" height="330" rx="12" class="group"/>
    <text x="728" y="266" class="strong">Ноутбук</text>
    <g>
      <rect x="728" y="276" width="220" height="56" rx="8" class="node"/>
      <text x="744" y="300" class="name">Браузер</text>
      <text x="744" y="320" class="muted">приложение todo</text>
    </g>
    <g>
      <rect x="728" y="412" width="220" height="68" rx="8" class="node"/>
      <text x="744" y="436" class="name">Подчинённый сервер</text>
      <text x="744" y="456" class="muted">устройства не подключает</text>
    </g>
    <g>
      <rect x="728" y="496" width="220" height="66" rx="8" class="disk"/>
      <path d="M742,508 a7,3 0 1,0 14,0 a7,3 0 1,0 -14,0 v10 a7,3 0 0,0 14,0 v-10" class="icon"/>
      <text x="764" y="518" class="strong">Диск ноутбука</text>
      <text x="742" y="538" class="mono">apps/&lt;id&gt;/data.json</text>
      <text x="742" y="554" class="mono">apps/&lt;id&gt;/history/</text>
    </g>
    <!-- devices: a session to the main, and pairing with it -->
    <line x1="728" y1="296" x2="260" y2="296" class="session" marker-end="url(#head-session)"/>
    <line x1="728" y1="312" x2="260" y2="312" class="pairing"/>
    <line x1="408" y1="360" x2="260" y2="360" class="session" marker-end="url(#head-session)"/>
    <line x1="408" y1="376" x2="260" y2="376" class="pairing"/>
    <!-- the subordinate's link to the main, and its pairing as a server -->
    <line x1="728" y1="436" x2="260" y2="436" class="link" marker-end="url(#head-link)"/>
    <line x1="728" y1="452" x2="260" y2="452" class="pairing"/>
    <text x="494" y="424" class="t-link strong" text-anchor="middle">связь: получает и отправляет документы</text>
    <text x="494" y="472" class="t-pairing" text-anchor="middle">подключён один раз, как сервер</text>
    <text x="494" y="492" class="muted" text-anchor="middle">главному: свои данные для подключения</text>
    <text x="494" y="510" class="muted" text-anchor="middle">от главного: приложения, реестр устройств</text>
    <!-- what the main's welcome carries -->
    <rect x="300" y="526" width="388" height="112" rx="8" class="callout"/>
    <text x="316" y="548" class="t-session strong">welcome: ответ главного устройству</text>
    <text x="316" y="568" class="mono">role: "main"</text>
    <text x="420" y="568" class="muted">term не передаётся, пока он 0</text>
    <text x="316" y="586" class="mono">subordinates: [сервер ноутбука]</text>
    <text x="316" y="606" class="muted">у каждого id, имя, пароль ICE,</text>
    <text x="316" y="624" class="muted">отпечаток, порт и адреса; без секрета</text>
  </g>
  <!-- Scene 2: away -->
  <g>
    <rect x="16" y="672" width="968" height="476" rx="12" class="panel"/>
    <text x="36" y="704" class="h2">2 · В дороге</text>
    <text x="36" y="728" class="lead muted">Главный недоступен. Устройства синхронизируются с сервером ноутбука без повторного подключения.</text>
    <g>
      <rect x="36" y="752" width="224" height="220" rx="8" class="off"/>
      <text x="52" y="776" class="name muted">Главный сервер</text>
      <text x="52" y="796" class="muted">на ПК, дома</text>
      <text x="52" y="836" class="muted strong">недоступен</text>
    </g>
    <circle cx="236" cy="774" r="9" class="cross"/>
    <path d="M232,770 L240,778 M240,770 L232,778" class="cross-mark"/>
    <g>
      <rect x="36" y="988" width="224" height="66" rx="8" class="disk-off"/>
      <path d="M50,1000 a7,3 0 1,0 14,0 a7,3 0 1,0 -14,0 v10 a7,3 0 0,0 14,0 v-10" class="icon"/>
      <text x="72" y="1010" class="strong muted">Диск ПК</text>
      <text x="50" y="1030" class="mono muted">apps/&lt;id&gt;/data.json</text>
      <text x="50" y="1046" class="mono muted">apps/&lt;id&gt;/history/</text>
    </g>
    <text x="494" y="772" class="muted" text-anchor="middle">Без повторного подключения: телефон знает сервер</text>
    <text x="494" y="790" class="muted" text-anchor="middle">ноутбука из welcome главного, а ноутбук пускает</text>
    <text x="494" y="808" class="muted" text-anchor="middle">устройства по реестру главного.</text>
    <g>
      <rect x="408" y="832" width="160" height="56" rx="8" class="node"/>
      <text x="424" y="856" class="name">Телефон</text>
      <text x="424" y="876" class="muted">приложение todo</text>
    </g>
    <rect x="712" y="738" width="252" height="330" rx="12" class="group"/>
    <text x="728" y="758" class="strong">Ноутбук</text>
    <g>
      <rect x="728" y="768" width="220" height="56" rx="8" class="node"/>
      <text x="744" y="792" class="name">Браузер</text>
      <text x="744" y="812" class="muted">приложение todo</text>
    </g>
    <g>
      <rect x="728" y="904" width="220" height="68" rx="8" class="node"/>
      <text x="744" y="928" class="name">Подчинённый сервер</text>
      <text x="744" y="948" class="muted">устройства не подключает</text>
    </g>
    <g>
      <rect x="728" y="988" width="220" height="66" rx="8" class="disk"/>
      <path d="M742,1000 a7,3 0 1,0 14,0 a7,3 0 1,0 -14,0 v10 a7,3 0 0,0 14,0 v-10" class="icon"/>
      <text x="764" y="1010" class="strong">Диск ноутбука</text>
      <text x="742" y="1030" class="mono">apps/&lt;id&gt;/data.json</text>
      <text x="742" y="1046" class="mono">apps/&lt;id&gt;/history/</text>
    </g>
    <!-- devices: sessions to the laptop's server -->
    <path d="M568,860 H640 V920 H728" class="session" marker-end="url(#head-session)"/>
    <path d="M838,824 V904" class="session" marker-end="url(#head-session)"/>
    <!-- the link is down; later the laptop pushes home -->
    <line x1="728" y1="944" x2="260" y2="944" class="gone"/>
    <circle cx="600" cy="944" r="9" class="cross"/>
    <path d="M596,940 L604,948 M604,940 L596,948" class="cross-mark"/>
    <text x="420" y="936" class="muted" text-anchor="middle">в дороге связи нет</text>
    <line x1="728" y1="962" x2="260" y2="962" class="link later" marker-end="url(#head-link)"/>
    <text x="494" y="982" class="t-link strong" text-anchor="middle">позже, дома: отправка</text>
    <!-- the sync rule when the link comes back -->
    <rect x="300" y="1000" width="388" height="130" rx="8" class="callout"/>
    <text x="316" y="1022" class="t-link strong">Когда связь вернётся:</text>
    <text x="316" y="1042">изменился только ноутбук → он отправляет:</text>
    <text x="332" y="1060" class="mono">put на главный с ifEtag = base</text>
    <text x="316" y="1078">изменились оба → на ноутбуке побеждает главный;</text>
    <text x="332" y="1096">своя копия уходит в history/, устройства сливают</text>
    <text x="332" y="1114">заново и записывают, ноутбук отправляет итог</text>
  </g>
  <!-- Scene 3: switching the main -->
  <g>
    <rect x="16" y="1164" width="968" height="470" rx="12" class="panel"/>
    <text x="36" y="1196" class="h2">3 · Смена главного</text>
    <text x="36" y="1220" class="lead muted">Каждая смена главного увеличивает term на единицу. Побеждает больший (term, serverId).</text>
    <line x1="500" y1="1240" x2="500" y2="1618" class="divider"/>
    <!-- planned: the main is reachable -->
    <text x="48" y="1256" class="h3">Плановая: главный доступен</text>
    <text x="48" y="1282" class="muted">До</text>
    <rect x="48" y="1290" width="170" height="54" rx="8" class="main"/>
    <text x="62" y="1312" class="strong">ПК</text>
    <text x="62" y="1332">главный · term 0</text>
    <rect x="310" y="1290" width="170" height="54" rx="8" class="node"/>
    <text x="324" y="1312" class="strong">Ноутбук</text>
    <text x="324" y="1332" class="muted">подчинённый</text>
    <line x1="310" y1="1317" x2="218" y2="1317" class="link" marker-end="url(#head-link)"/>
    <text x="48" y="1374">1. На странице ноутбука: «Сделать этот сервер главным»</text>
    <text x="65" y="1393">(на странице главного: «Сделать главным» на его карточке)</text>
    <text x="48" y="1412">2. Сначала документы на обоих серверах совпадают</text>
    <text x="65" y="1431">(ждёт не больше 10 с); term 0 → 1.</text>
    <text x="48" y="1450">3. ПК уступает роль, получает от ноутбука токен</text>
    <text x="65" y="1469">сервера и связывается с ним.</text>
    <text x="48" y="1488">4. Другие подчинённые перестраивают связь; устройства</text>
    <text x="65" y="1507">узнают нового главного из следующего welcome.</text>
    <text x="48" y="1556" class="muted">После</text>
    <rect x="48" y="1564" width="170" height="54" rx="8" class="node"/>
    <text x="62" y="1586" class="strong">ПК</text>
    <text x="62" y="1606" class="muted">подчинённый</text>
    <rect x="310" y="1564" width="170" height="54" rx="8" class="main"/>
    <text x="324" y="1586" class="strong">Ноутбук</text>
    <text x="324" y="1606">главный · term 1</text>
    <line x1="218" y1="1591" x2="310" y2="1591" class="link" marker-end="url(#head-link)"/>
    <!-- forced: the main is unreachable -->
    <text x="528" y="1256" class="h3">Вынужденная: главный недоступен</text>
    <text x="528" y="1282" class="muted">Пока порознь</text>
    <rect x="528" y="1290" width="170" height="54" rx="8" class="main"/>
    <text x="542" y="1312" class="strong">ПК</text>
    <text x="542" y="1332">главный · term 0</text>
    <rect x="790" y="1290" width="170" height="54" rx="8" class="main"/>
    <text x="804" y="1312" class="strong">Ноутбук</text>
    <text x="804" y="1332">главный · term 1</text>
    <line x1="698" y1="1317" x2="790" y2="1317" class="gone"/>
    <circle cx="744" cy="1317" r="9" class="cross"/>
    <path d="M740,1313 L748,1321 M748,1313 L740,1321" class="cross-mark"/>
    <text x="528" y="1374">1. Та же кнопка, но с подтверждением.</text>
    <text x="528" y="1393">2. Ноутбук становится главным с term 1; ПК, если он</text>
    <text x="545" y="1412">ещё работает, остаётся главным с term 0.</text>
    <text x="528" y="1431">3. Устройства синхронизируются с тем, кого достанут;</text>
    <text x="545" y="1450">ничего не теряется.</text>
    <text x="528" y="1469">4. При встрече побеждает больший term: ПК уступает</text>
    <text x="545" y="1488">роль и связывается с ноутбуком.</text>
    <text x="528" y="1507">5. При равном term побеждает больший serverId.</text>
    <text x="545" y="1526">Реестры устройств объединяются, с отметками удалений.</text>
    <text x="528" y="1556" class="muted">Когда встретились</text>
    <rect x="528" y="1564" width="170" height="54" rx="8" class="node"/>
    <text x="542" y="1586" class="strong">ПК</text>
    <text x="542" y="1606" class="muted">подчинённый</text>
    <rect x="790" y="1564" width="170" height="54" rx="8" class="main"/>
    <text x="804" y="1586" class="strong">Ноутбук</text>
    <text x="804" y="1606">главный · term 1</text>
    <line x1="698" y1="1591" x2="790" y2="1591" class="link" marker-end="url(#head-link)"/>
  </g>
</svg>
