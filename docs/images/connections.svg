<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1646" width="1000" height="1646" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">The local hub: how servers and devices connect</title>
  <desc id="desc">Three scenes. At home: the phone and the laptop’s browser sync with the main server on the PC; the subordinate server on the laptop links to the main, pulls and pushes the documents, and keeps the same files (apps/&lt;id&gt;/data.json and apps/&lt;id&gt;/history/) on its own disk; the main’s welcome tells each device its role and the list of subordinates, and the family’s term once it is above 0. Away: the main is out of reach; the phone and the laptop’s browser sync with the laptop’s server without pairing again; back home the link returns and the laptop pushes, and when both sides changed the main’s copy wins on the laptop, whose own copy stays in history/. Switching the main: a planned switch waits until both servers hold the same documents, raises the term from 0 to 1, and the old main steps down and links to the new one; a forced switch leaves two mains, at terms 0 and 1, until they meet, when the higher term wins and a tie goes to the higher serverId. Legend: device sessions, the server link, and pairing, which happens only with the main.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; }
    .h1 { font-size: 24px; font-weight: 700; }
    .h2 { font-size: 18px; font-weight: 700; }
    .h3 { font-size: 15px; font-weight: 700; }
    .name { font-size: 15px; font-weight: 650; }
    .lead { font-size: 14px; }
    .strong { font-weight: 650; }
    .muted { fill: #59636e; }
    .t-session { fill: #0969da; }
    .t-link { fill: #bc4c00; }
    .t-pairing { fill: #1a7f37; }
    .bg { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .node { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
    .main { fill: #f5f0ff; stroke: #8250df; stroke-width: 2.5; }
    .off { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .group { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 2 4; }
    .disk { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .disk-off { fill: none; stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 6 4; }
    .callout { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .divider { stroke: #d0d7de; stroke-width: 1; }
    .icon { fill: none; stroke: #59636e; stroke-width: 1.3; }
    .session { fill: none; stroke: #0969da; stroke-width: 2; }
    .link { fill: none; stroke: #bc4c00; stroke-width: 3.5; }
    .later { stroke-dasharray: 9 6; }
    .pairing { fill: none; stroke: #1a7f37; stroke-width: 2; stroke-dasharray: 7 5; }
    .gone { fill: none; stroke: #8c959f; stroke-width: 2; stroke-dasharray: 3 5; }
    .cross { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
    .cross-mark { fill: none; stroke: #59636e; stroke-width: 2; }
    .head-session { fill: #0969da; }
    .head-link { fill: #bc4c00; }
  </style>
  <defs>
    <marker id="head-session" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path class="head-session" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="head-link" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path class="head-link" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="1646" rx="16" class="bg"/>
  <text x="32" y="46" class="h1">The local hub: servers and devices</text>
  <text x="32" y="72" class="lead muted">The PC runs the main server, the laptop a subordinate one. Devices pair only with the main.</text>
  <!-- Legend -->
  <g>
    <rect x="16" y="88" width="968" height="76" rx="10" class="panel"/>
    <line x1="36" y1="113.5" x2="80" y2="113.5" class="session" marker-end="url(#head-session)"/>
    <text x="92" y="118">device session</text>
    <line x1="356" y1="113.5" x2="400" y2="113.5" class="link" marker-end="url(#head-link)"/>
    <text x="412" y="118">server link: subordinate → main</text>
    <line x1="676" y1="113.5" x2="720" y2="113.5" class="pairing"/>
    <text x="732" y="118">pairing: only with the main</text>
    <rect x="36" y="133" width="44" height="18" rx="5" class="main"/>
    <text x="92" y="148">main server</text>
    <rect x="356" y="133" width="44" height="18" rx="5" class="node"/>
    <text x="412" y="148">subordinate server</text>
    <line x1="676" y1="143.5" x2="720" y2="143.5" class="gone"/>
    <circle cx="698" cy="143.5" r="9" class="cross"/>
    <path d="M694,139.5 L702,147.5 M702,139.5 L694,147.5" class="cross-mark"/>
    <text x="732" y="148">out of reach</text>
  </g>
  <!-- Scene 1: at home -->
  <g>
    <rect x="16" y="180" width="968" height="476" rx="12" class="panel"/>
    <text x="36" y="212" class="h2">1 · At home</text>
    <text x="36" y="236" class="lead muted">Devices sync with the main and prefer it. The laptop’s server keeps its own copy over the link.</text>
    <g>
      <rect x="36" y="260" width="224" height="220" rx="8" class="main"/>
      <text x="52" y="284" class="name">Main server</text>
      <text x="52" y="304" class="muted">on the PC</text>
      <text x="52" y="344">pairs devices</text>
      <text x="52" y="364">hands out its subordinates</text>
    </g>
    <g>
      <rect x="36" y="496" width="224" height="66" rx="8" class="disk"/>
      <path d="M50,508 a7,3 0 1,0 14,0 a7,3 0 1,0 -14,0 v10 a7,3 0 0,0 14,0 v-10" class="icon"/>
      <text x="72" y="518" class="strong">PC disk</text>
      <text x="50" y="538" class="mono">apps/&lt;id&gt;/data.json</text>
      <text x="50" y="554" class="mono">apps/&lt;id&gt;/history/</text>
    </g>
    <g>
      <rect x="408" y="340" width="160" height="56" rx="8" class="node"/>
      <text x="424" y="364" class="name">Phone</text>
      <text x="424" y="384" class="muted">todo app</text>
    </g>
    <rect x="712" y="246" width="252" height="330" rx="12" class="group"/>
    <text x="728" y="266" class="strong">Laptop</text>
    <g>
      <rect x="728" y="276" width="220" height="56" rx="8" class="node"/>
      <text x="744" y="300" class="name">Browser</text>
      <text x="744" y="320" class="muted">todo app</text>
    </g>
    <g>
      <rect x="728" y="412" width="220" height="68" rx="8" class="node"/>
      <text x="744" y="436" class="name">Subordinate server</text>
      <text x="744" y="456" class="muted">pairs no devices</text>
    </g>
    <g>
      <rect x="728" y="496" width="220" height="66" rx="8" class="disk"/>
      <path d="M742,508 a7,3 0 1,0 14,0 a7,3 0 1,0 -14,0 v10 a7,3 0 0,0 14,0 v-10" class="icon"/>
      <text x="764" y="518" class="strong">Laptop disk</text>
      <text x="742" y="538" class="mono">apps/&lt;id&gt;/data.json</text>
      <text x="742" y="554" class="mono">apps/&lt;id&gt;/history/</text>
    </g>
    <!-- devices: a session to the main, and pairing with it -->
    <line x1="728" y1="296" x2="260" y2="296" class="session" marker-end="url(#head-session)"/>
    <line x1="728" y1="312" x2="260" y2="312" class="pairing"/>
    <line x1="408" y1="360" x2="260" y2="360" class="session" marker-end="url(#head-session)"/>
    <line x1="408" y1="376" x2="260" y2="376" class="pairing"/>
    <!-- the subordinate's link to the main, and its pairing as a server -->
    <line x1="728" y1="436" x2="260" y2="436" class="link" marker-end="url(#head-link)"/>
    <line x1="728" y1="452" x2="260" y2="452" class="pairing"/>
    <text x="494" y="424" class="t-link strong" text-anchor="middle">link: pulls and pushes the documents</text>
    <text x="494" y="472" class="t-pairing" text-anchor="middle">paired once, as a server</text>
    <text x="494" y="492" class="muted" text-anchor="middle">to the main: its connection data</text>
    <text x="494" y="510" class="muted" text-anchor="middle">from the main: app list, device registry</text>
    <!-- what the main's welcome carries -->
    <rect x="300" y="526" width="388" height="112" rx="8" class="callout"/>
    <text x="316" y="548" class="t-session strong">welcome: the main’s answer to a device</text>
    <text x="316" y="568" class="mono">role: "main"</text>
    <text x="420" y="568" class="muted">term: left out while it is 0</text>
    <text x="316" y="586" class="mono">subordinates: [the laptop’s server]</text>
    <text x="316" y="606" class="muted">each with id, name, ICE password,</text>
    <text x="316" y="624" class="muted">fingerprint, port and hosts; no secret</text>
  </g>
  <!-- Scene 2: away -->
  <g>
    <rect x="16" y="672" width="968" height="476" rx="12" class="panel"/>
    <text x="36" y="704" class="h2">2 · Away</text>
    <text x="36" y="728" class="lead muted">The main is out of reach. Devices sync with the laptop’s server, without pairing again.</text>
    <g>
      <rect x="36" y="752" width="224" height="220" rx="8" class="off"/>
      <text x="52" y="776" class="name muted">Main server</text>
      <text x="52" y="796" class="muted">on the PC, at home</text>
      <text x="52" y="836" class="muted strong">out of reach</text>
    </g>
    <circle cx="236" cy="774" r="9" class="cross"/>
    <path d="M232,770 L240,778 M240,770 L232,778" class="cross-mark"/>
    <g>
      <rect x="36" y="988" width="224" height="66" rx="8" class="disk-off"/>
      <path d="M50,1000 a7,3 0 1,0 14,0 a7,3 0 1,0 -14,0 v10 a7,3 0 0,0 14,0 v-10" class="icon"/>
      <text x="72" y="1010" class="strong muted">PC disk</text>
      <text x="50" y="1030" class="mono muted">apps/&lt;id&gt;/data.json</text>
      <text x="50" y="1046" class="mono muted">apps/&lt;id&gt;/history/</text>
    </g>
    <text x="494" y="772" class="muted" text-anchor="middle">No second pairing: the phone knows the laptop’s</text>
    <text x="494" y="790" class="muted" text-anchor="middle">server from the main’s welcome, and the laptop</text>
    <text x="494" y="808" class="muted" text-anchor="middle">admits devices from the main’s registry.</text>
    <g>
      <rect x="408" y="832" width="160" height="56" rx="8" class="node"/>
      <text x="424" y="856" class="name">Phone</text>
      <text x="424" y="876" class="muted">todo app</text>
    </g>
    <rect x="712" y="738" width="252" height="330" rx="12" class="group"/>
    <text x="728" y="758" class="strong">Laptop</text>
    <g>
      <rect x="728" y="768" width="220" height="56" rx="8" class="node"/>
      <text x="744" y="792" class="name">Browser</text>
      <text x="744" y="812" class="muted">todo app</text>
    </g>
    <g>
      <rect x="728" y="904" width="220" height="68" rx="8" class="node"/>
      <text x="744" y="928" class="name">Subordinate server</text>
      <text x="744" y="948" class="muted">pairs no devices</text>
    </g>
    <g>
      <rect x="728" y="988" width="220" height="66" rx="8" class="disk"/>
      <path d="M742,1000 a7,3 0 1,0 14,0 a7,3 0 1,0 -14,0 v10 a7,3 0 0,0 14,0 v-10" class="icon"/>
      <text x="764" y="1010" class="strong">Laptop disk</text>
      <text x="742" y="1030" class="mono">apps/&lt;id&gt;/data.json</text>
      <text x="742" y="1046" class="mono">apps/&lt;id&gt;/history/</text>
    </g>
    <!-- devices: sessions to the laptop's server -->
    <path d="M568,860 H640 V920 H728" class="session" marker-end="url(#head-session)"/>
    <path d="M838,824 V904" class="session" marker-end="url(#head-session)"/>
    <!-- the link is down; later the laptop pushes home -->
    <line x1="728" y1="944" x2="260" y2="944" class="gone"/>
    <circle cx="600" cy="944" r="9" class="cross"/>
    <path d="M596,940 L604,948 M604,940 L596,948" class="cross-mark"/>
    <text x="420" y="936" class="muted" text-anchor="middle">no link while away</text>
    <line x1="728" y1="962" x2="260" y2="962" class="link later" marker-end="url(#head-link)"/>
    <text x="494" y="982" class="t-link strong" text-anchor="middle">later, back home: push</text>
    <!-- the sync rule when the link comes back -->
    <rect x="300" y="1000" width="388" height="130" rx="8" class="callout"/>
    <text x="316" y="1022" class="t-link strong">When the link comes back:</text>
    <text x="316" y="1042">only the laptop moved → it pushes:</text>
    <text x="332" y="1060" class="mono">put to the main with ifEtag = base</text>
    <text x="316" y="1078">both moved → the main’s copy wins on the laptop;</text>
    <text x="332" y="1096">its own goes to history/, devices merge again,</text>
    <text x="332" y="1114">write back, and the laptop pushes the result</text>
  </g>
  <!-- Scene 3: switching the main -->
  <g>
    <rect x="16" y="1164" width="968" height="470" rx="12" class="panel"/>
    <text x="36" y="1196" class="h2">3 · Switching the main</text>
    <text x="36" y="1220" class="lead muted">Every change of main raises the term by one. The higher (term, serverId) wins.</text>
    <line x1="500" y1="1240" x2="500" y2="1618" class="divider"/>
    <!-- planned: the main is reachable -->
    <text x="48" y="1256" class="h3">Planned: the main is reachable</text>
    <text x="48" y="1282" class="muted">Before</text>
    <rect x="48" y="1290" width="170" height="54" rx="8" class="main"/>
    <text x="62" y="1312" class="strong">PC</text>
    <text x="62" y="1332">main · term 0</text>
    <rect x="310" y="1290" width="170" height="54" rx="8" class="node"/>
    <text x="324" y="1312" class="strong">Laptop</text>
    <text x="324" y="1332" class="muted">subordinate</text>
    <line x1="310" y1="1317" x2="218" y2="1317" class="link" marker-end="url(#head-link)"/>
    <text x="48" y="1374">1. On the laptop’s page: “Make this server the main”</text>
    <text x="65" y="1393">(on the main’s page: “Make it the main” on its card)</text>
    <text x="48" y="1412">2. Both servers hold the same documents first (it</text>
    <text x="65" y="1431">waits 10 s at most); term 0 → 1.</text>
    <text x="48" y="1450">3. The PC steps down, gets a server token from the</text>
    <text x="65" y="1469">laptop, and links to it.</text>
    <text x="48" y="1488">4. Other subordinates relink; devices learn the new</text>
    <text x="65" y="1507">main from their next welcome.</text>
    <text x="48" y="1556" class="muted">After</text>
    <rect x="48" y="1564" width="170" height="54" rx="8" class="node"/>
    <text x="62" y="1586" class="strong">PC</text>
    <text x="62" y="1606" class="muted">subordinate</text>
    <rect x="310" y="1564" width="170" height="54" rx="8" class="main"/>
    <text x="324" y="1586" class="strong">Laptop</text>
    <text x="324" y="1606">main · term 1</text>
    <line x1="218" y1="1591" x2="310" y2="1591" class="link" marker-end="url(#head-link)"/>
    <!-- forced: the main is unreachable -->
    <text x="528" y="1256" class="h3">Forced: the main is unreachable</text>
    <text x="528" y="1282" class="muted">While apart</text>
    <rect x="528" y="1290" width="170" height="54" rx="8" class="main"/>
    <text x="542" y="1312" class="strong">PC</text>
    <text x="542" y="1332">main · term 0</text>
    <rect x="790" y="1290" width="170" height="54" rx="8" class="main"/>
    <text x="804" y="1312" class="strong">Laptop</text>
    <text x="804" y="1332">main · term 1</text>
    <line x1="698" y1="1317" x2="790" y2="1317" class="gone"/>
    <circle cx="744" cy="1317" r="9" class="cross"/>
    <path d="M740,1313 L748,1321 M748,1313 L740,1321" class="cross-mark"/>
    <text x="528" y="1374">1. The same button, behind a confirmation.</text>
    <text x="528" y="1393">2. The laptop becomes the main at term 1; the PC, if</text>
    <text x="545" y="1412">still running, stays the main at term 0.</text>
    <text x="528" y="1431">3. Devices sync with whichever one they reach;</text>
    <text x="545" y="1450">nothing is lost.</text>
    <text x="528" y="1469">4. When they meet, the higher term wins: the PC</text>
    <text x="545" y="1488">steps down and links to the laptop.</text>
    <text x="528" y="1507">5. Same term: the higher serverId wins. The device</text>
    <text x="545" y="1526">registries merge by union, with tombstones.</text>
    <text x="528" y="1556" class="muted">When they meet</text>
    <rect x="528" y="1564" width="170" height="54" rx="8" class="node"/>
    <text x="542" y="1586" class="strong">PC</text>
    <text x="542" y="1606" class="muted">subordinate</text>
    <rect x="790" y="1564" width="170" height="54" rx="8" class="main"/>
    <text x="804" y="1586" class="strong">Laptop</text>
    <text x="804" y="1606">main · term 1</text>
    <line x1="698" y1="1591" x2="790" y2="1591" class="link" marker-end="url(#head-link)"/>
  </g>
</svg>
